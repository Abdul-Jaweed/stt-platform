[project]
name = "stt-platform-backend"
version = "0.1.0"
description = "Provider-neutral Speech-to-Text platform backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.0",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "python-multipart==0.0.32",
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.2",
  "onnxruntime==1.31.0",
  "nvidia-cublas-cu12==12.9.2.10",
  "nvidia-cudnn-cu12==9.27.0.42",
  "av==18.1.0",
  "boto3>=1.43.111",
  "temporalio>=1.34.0",
  "httpx>=0.28.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-exporter-prometheus>=0.66b1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "psutil>=7.2.2",
  "pynvml>=13.0.1",
  "mlflow-skinny>=3.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "respx>=0.23.1",
    "jiwer>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_platform"]

[tool.ruff]
target-version = "py313"
# The codebase was written at ~100 columns; E501 is enforced from here on.
line-length = 100

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set widened in 0.16, which would
# otherwise silently change what "clean" means across lockfile updates.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PLW"]
ignore = [
    # FastAPI's DI idiom (Depends/File/Form in argument defaults) is by design.
    "B008",
    # JobStatus keeps the (str, Enum) mixin: StrEnum would change str()
    # semantics for a type that crosses the DB and the API wire. Changing it
    # is a deliberate migration with its own tests, not a lint autofix.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests: dict() keyword calls read better for multi-arg fixtures, and the
# subprocess probes deliberately tolerate a non-zero exit.
"tests/**" = ["C408", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not live_provider'"
markers = [
    "gpu: requires CUDA GPU and cached model",
    "live_provider: real paid provider call; needs STT_<PROVIDER>_API_KEY (opt-in, never in default gates)",
]
