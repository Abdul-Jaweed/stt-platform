site_name: Evidance
site_description: >-
  Evidance — a provider-neutral speech-to-text platform. One headless /v1 API,
  swappable providers, durable jobs, and a React console.
site_url: https://abdul-jaweed.github.io/stt-platform/
repo_url: https://github.com/Abdul-Jaweed/stt-platform
docs_dir: docs

# docs/architecture.md and docs/architecture/README.md would both map to the
# same '/architecture/' URL in directory-URL mode — one silently shadows the
# other. Flat URLs keep every page reachable.
use_directory_urls: false

# Internal build plans are not part of the published site.
exclude_docs: |
  superpowers/**

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Overview: index.md
  - API: api.md
  - Deployment and configuration: deployment.md
  - Operations: operations.md
  - Reliability: reliability.md
  - Incident recovery: incident-recovery.md
  - Observability: observability.md
  - Evaluation: evaluation.md
  - Streaming: streaming.md
  - UI: ui.md
  - Providers: providers.md
  - Live provider verification: live-provider-verification.md
  - Architecture:
      - Architecture overview: architecture.md
      - Architecture diagrams: architecture/README.md
      - "STT platform architecture — diagram (HTML)": architecture/stt-platform-architecture.html
      - "Transcription job lifecycle — diagram (HTML)": architecture/transcription-job-lifecycle.html
  - Phase reports:
      - "Phase 0 — Repository inspection and architecture": phase-0-report.md
      - "Phase 1 — Headless backend and local STT baseline": phase-1-report.md
      - "Phase 2 — Durable processing": phase-2-report.md
      - "Phase 3 — Separate frontend": phase-3-report.md
      - "Phase 4 — Managed providers": phase-4-report.md
      - "Phase 5 — Observability": phase-5-report.md
      - "Phase 6 — Evaluation": phase-6-report.md
      - "Phase 7 — Hardening": phase-7-report.md
      - "Phase 8 — Streaming (local-first)": phase-8-report.md
