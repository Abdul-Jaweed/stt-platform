server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. With a variable in proxy_pass, nginx asks it again
    # every 10s instead of caching the address it saw when the config loaded:
    # a recreated API container keeps working without restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Client-side routing: /jobs/xyz is a React route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The streaming socket. nginx must forward the handshake, not answer it,
    # and a session can be quiet between utterances -- so the read timeout is
    # the stream's own cap plus slack, not the 300s an upload gets.
    location = /v1/transcriptions/stream {
        set $api_stream http://api:8200;
        proxy_pass $api_stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Same-origin API. The browser never needs a hostname, a port or a key.
    location /v1/ {
        set $api_upstream http://api:8200;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Recordings and uploads go through here; the API caps them itself.
        client_max_body_size 200m;
    }

    # A readiness endpoint for anything watching the container.
    location = /health {
        set $api_ready http://api:8200/v1/health/ready;
        proxy_pass $api_ready;
    }

    # Vite fingerprints everything under /assets, so it is immutable; the
    # entry document must never be cached or a deploy would not be picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /favicon.svg {
        expires 7d;
    }
}
